openapi: 3.0.3

info:
  title: Globalance
  version: 1.0.0
  description: Documentación de la API del backend de la billetera virtual Globalance.

servers:
  - url: http://localhost:3000/api
    description: Servidor local

  - url: https://backend-globalance-production-5e5a.up.railway.app/api
    description: Servidor de producción

tags:
  - name: Health
    description: Estado del servidor y conexión con la base de datos

  - name: Authentication
    description: Autenticación y sincronización de usuarios con Firebase

  - name: Wallet
    description: Información de la billetera del usuario

  - name: Balances
    description: Consulta de saldos disponibles

  - name: Users
    description: Gestión del perfil personal o empresarial

  - name: Transactions
    description: Operaciones de la billetera (cargas, cambios de moneda)

  - name: Exchange
    description: Cotizaciones de cambio de moneda

  - name: Emails
    description: Reintento de notificaciones por correo electrónico

  - name: AI Assistant
    description: Asistencia financiera automatizada usando IA

  - name: Payment Requests
    description: Gestión de solicitudes de cobro entre usuarios

paths:
  /health:
    get:
      security: []
      tags:
        - Health
      summary: Verificar el estado del backend
      description: Comprueba que el servidor y la base de datos estén funcionando.
      responses:
        "200":
          description: El backend funciona correctamente
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      status:
                        type: string
                        example: ok
                      database:
                        type: string
                        example: connected
                      timestamp:
                        type: string
                        format: date-time
        "500":
          description: Error interno del servidor
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /auth/me:
    get:
      tags:
        - Authentication
      summary: Obtener el usuario autenticado de Firebase
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Usuario autenticado
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/FirebaseUser"
        "401":
          description: Token ausente, inválido o vencido
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/sync:
    post:
      tags:
        - Authentication
      summary: Sincronizar el usuario de Firebase con PostgreSQL
      description: Crea el usuario, su billetera y sus balances iniciales si todavía no existen.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Usuario sincronizado correctamente
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    oneOf:
                      - $ref: "#/components/schemas/User"
                      - type: object
                        properties:
                          user:
                            $ref: "#/components/schemas/User"
                          wallet:
                            $ref: "#/components/schemas/Wallet"
        "400":
          description: El usuario autenticado no contiene un correo electrónico
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Usuario no autenticado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Error interno del servidor
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /wallet:
    get:
      tags:
        - Wallet
      summary: Consultar la billetera del usuario
      description: Devuelve los datos del usuario, su billetera y los saldos disponibles en ARS, USD y EUR.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Billetera obtenida correctamente
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WalletSummary"
        "401":
          description: Token ausente, inválido o vencido
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Usuario o billetera no encontrados, o error interno
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /balances:
    get:
      tags:
        - Balances
      summary: Consultar los saldos del usuario
      description: Devuelve los saldos de la billetera autenticada en ARS, USD y EUR.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Saldos obtenidos correctamente
          content:
            application/json:
              schema:
                type: object
                properties:
                  balances:
                    type: array
                    items:
                      $ref: "#/components/schemas/Balance"
        "401":
          description: Token ausente, inválido o vencido
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Usuario o billetera no encontrados, o error interno
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /users/profile:
    get:
      tags:
        - Users
      summary: Consultar el perfil del usuario
      description: Devuelve el perfil personal o empresarial del usuario autenticado.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Perfil obtenido correctamente
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/UserProfile"
        "401":
          description: Token ausente, inválido o vencido
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Error interno del servidor
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    patch:
      tags:
        - Users
      summary: Crear o editar el perfil del usuario
      description: >
        Crea el perfil personal o empresarial si no existe y lo actualiza si ya
        existe (upsert). Incluye la moneda principal (displayCurrency), que define
        cómo se presentan las operaciones de compra y venta.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - $ref: "#/components/schemas/PersonProfileInput"
                - $ref: "#/components/schemas/CompanyProfileInput"
      responses:
        "200":
          description: Perfil creado o actualizado correctamente
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      message:
                        type: string
                        example: Perfil completado correctamente.
        "400":
          description: Datos del perfil inválidos
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Token ausente, inválido o vencido
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Usuario no encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: >
            Conflicto con el estado del recurso: alias o documento duplicado,
            o intento de modificar el tipo de usuario (USER_TYPE_NOT_EDITABLE).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Error interno del servidor
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /transactions:
    get:
      tags:
        - Transactions
      summary: Obtener el historial de movimientos
      description: >
        Devuelve los movimientos del usuario ordenados de más reciente a más
        antiguo. Admite filtros por tipo de operación, moneda y paginación por
        límite y desplazamiento.
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: type
          required: false
          schema:
            type: string
            enum:
              - income
              - purchase
              - sale
              - conversion
              - transfer
          description: Filtra por tipo de operación.
        - in: query
          name: currency
          required: false
          schema:
            type: string
            enum:
              - ARS
              - USD
              - EUR
          description: Filtra por moneda involucrada.
        - in: query
          name: limit
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
          description: Cantidad máxima de movimientos a devolver.
        - in: query
          name: offset
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
          description: Cantidad de movimientos a saltear (para paginar).
      responses:
        "200":
          description: Historial de movimientos
          content:
            application/json:
              schema:
                type: object
                properties:
                  transactions:
                    type: array
                    items:
                      $ref: "#/components/schemas/Transaction"
                  pagination:
                    type: object
                    properties:
                      limit:
                        type: integer
                      offset:
                        type: integer
                      returned:
                        type: integer
        "400":
          description: Filtros de consulta inválidos
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Token ausente, inválido o vencido
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Usuario o billetera no encontrados
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Error interno del servidor
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /transactions/exchange:
    post:
      tags:
        - Transactions
      summary: Realizar una operación de cambio (compra, venta o conversión)
      description: >
        Convierte una moneda en otra aplicando la tasa del día (Frankfurter con
        fallback a ExchangeRate-API). El tipo se clasifica según la moneda
        principal (displayCurrency): si el origen es la principal se registra
        como sale, si el destino es la principal como purchase, y si ninguna lo
        es como conversion. Respeta un límite diario de 30 operaciones.
      security:
        - bearerAuth: []
      parameters:
        - in: header
          name: Idempotency-Key
          required: true
          schema:
            type: string
            maxLength: 100
          description: Clave de idempotencia para evitar duplicados.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExchangeInput"
      responses:
        "201":
          description: Operación de cambio realizada correctamente
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Operación de cambio realizada correctamente
                  transaction:
                    $ref: "#/components/schemas/ExchangeTransaction"
        "400":
          description: Datos inválidos o falta el encabezado Idempotency-Key
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Token ausente, inválido o vencido
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Usuario, billetera o saldo no encontrados
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Saldo insuficiente para la operación
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: Límite diario de operaciones de cambio alcanzado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "502":
          description: No se pudo obtener la tasa de los proveedores
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Error interno del servidor
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /transactions/income:
    post:
      tags:
        - Transactions
      summary: Carga de saldo demo
      description: >
        Realiza una carga de saldo demo en ARS, USD o EUR en la billetera del
        usuario. Solo disponible si está habilitada en la configuración.
      security:
        - bearerAuth: []
      parameters:
        - in: header
          name: Idempotency-Key
          required: true
          schema:
            type: string
            maxLength: 100
          description: Clave de idempotencia para evitar duplicados.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DemoFundingInput"
      responses:
        "201":
          description: Carga de saldo demo realizada correctamente
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Carga de saldo demo realizada correctamente
                  transaction:
                    $ref: "#/components/schemas/DemoFundingTransaction"
        "400":
          description: Datos inválidos o falta el encabezado Idempotency-Key
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Token ausente, inválido o vencido
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Carga de saldo demo deshabilitada o usuario inactivo
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Usuario o billetera no encontrados
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Error interno del servidor
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /transactions/transfers/internal:
    post:
      tags:
        - Transactions
      summary: Realizar transferencia interna
      description: >
        Realiza una transferencia de saldo a otro usuario de Globalance por
        alias o por número de cuenta.
      security:
        - bearerAuth: []
      parameters:
        - in: header
          name: Idempotency-Key
          required: true
          schema:
            type: string
            maxLength: 100
          description: Clave de idempotencia para evitar duplicados.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InternalTransferInput"
      responses:
        "201":
          description: Transferencia interna realizada correctamente
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Transferencia interna realizada correctamente
                  transaction:
                    $ref: "#/components/schemas/InternalTransferTransaction"
        "400":
          description: Datos inválidos o falta el encabezado Idempotency-Key
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Token ausente, inválido o vencido
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Usuario, billetera o saldo no encontrados (origen o destino)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Saldo insuficiente para realizar la transferencia
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Error interno del servidor
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /exchange/quotes:
    get:
      tags:
        - Exchange
      summary: Obtener una cotización estimada
      description: >
        Devuelve la tasa de cambio entre dos monedas y el monto estimado que se
        recibiría. Es una cotización de referencia (no persiste nada y vence en
        60 segundos).
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: source
          required: true
          schema:
            type: string
            enum:
              - ARS
              - USD
              - EUR
          description: Moneda de origen.
        - in: query
          name: target
          required: true
          schema:
            type: string
            enum:
              - ARS
              - USD
              - EUR
          description: Moneda de destino.
        - in: query
          name: amount
          required: false
          schema:
            type: string
          description: Monto en la moneda de origen (hasta 8 decimales). Por defecto 1.
      responses:
        "200":
          description: Cotización obtenida correctamente
          content:
            application/json:
              schema:
                type: object
                properties:
                  quote:
                    $ref: "#/components/schemas/Quote"
        "400":
          description: Parámetros de consulta inválidos
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Token ausente, inválido o vencido
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "502":
          description: No se pudo obtener la tasa de los proveedores
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Error interno del servidor
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /exchange/rates:
    get:
      tags:
        - Exchange
      summary: Obtener tasas de cambio desde una moneda base
      description: >
        Devuelve las tasas de cambio de la moneda base contra las demás monedas
        soportadas (ARS, USD, EUR). Si no se indica `base`, se usa la moneda
        principal (displayCurrency) del usuario. Las tasas usan la misma cache
        que el endpoint de cotización.
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: base
          required: false
          schema:
            type: string
            enum:
              - ARS
              - USD
              - EUR
          description: >
            Moneda base. Por defecto la moneda principal del usuario
            (displayCurrency).
      responses:
        "200":
          description: Tasas obtenidas correctamente
          content:
            application/json:
              schema:
                type: object
                properties:
                  rates:
                    $ref: "#/components/schemas/Rates"
        "400":
          description: Parámetros de consulta inválidos
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Token ausente, inválido o vencido
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "502":
          description: No se pudo obtener la tasa de los proveedores
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Error interno del servidor
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /ai/assistant:
    post:
      tags:
        - AI Assistant
      summary: Enviar una consulta al asistente financiero
      description: >
        Devuelve una respuesta del asistente basada en el contexto del
        usuario (saldos y movimientos recientes). Si no se configuró la
        clave de Gemini, responde en modo demostración.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AiAssistantInput"
      responses:
        "200":
          description: Respuesta del asistente
          content:
            application/json:
              schema:
                type: object
                properties:
                  reply:
                    type: string
                    example: "Tu saldo en dólares es de 1500 USD."
        "400":
          description: El mensaje es obligatorio o supera el límite de caracteres
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Token ausente, inválido o vencido
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "502":
          description: El proveedor de IA no respondió
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Error interno del servidor
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /payment-requests:
    post:
      tags:
        - Payment Requests
      summary: Crear una solicitud de cobro
      description: >
        Crea una solicitud de cobro pendiente para un pagador identificado
        por su correo electrónico.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePaymentRequestInput"
      responses:
        "201":
          description: Solicitud de cobro creada correctamente
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Solicitud de cobro creada correctamente
                  paymentRequest:
                    $ref: "#/components/schemas/PaymentRequest"
        "400":
          description: Datos de la solicitud inválidos
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Token ausente, inválido o vencido
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Usuario solicitante no encontrado o pagador no registrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Intento de crear una solicitud de cobro a uno mismo u otro conflicto
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Error interno del servidor
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    get:
      tags:
        - Payment Requests
      summary: Listar solicitudes de cobro
      description: >
        Devuelve la lista de solicitudes de cobro en las que participa el usuario,
        ya sea como creador (sent) o como pagador (received).
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: scope
          required: true
          schema:
            type: string
            enum:
              - sent
              - received
          description: "Filtrar por rol: enviadas o recibidas."
        - in: query
          name: status
          required: false
          schema:
            type: string
            enum:
              - pending
              - paid
              - expired
              - cancelled
          description: Filtrar por estado.
        - in: query
          name: limit
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
          description: Cantidad máxima de solicitudes a devolver.
        - in: query
          name: offset
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
          description: Desplazamiento para paginar.
      responses:
        "200":
          description: Listado obtenido correctamente
          content:
            application/json:
              schema:
                type: object
                properties:
                  paymentRequests:
                    type: array
                    items:
                      $ref: "#/components/schemas/PaymentRequest"
                  pagination:
                    type: object
                    properties:
                      limit:
                        type: integer
                      offset:
                        type: integer
                      returned:
                        type: integer
        "400":
          description: Parámetros de búsqueda inválidos
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Token ausente, inválido o vencido
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Error interno del servidor
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /payment-requests/{paymentToken}:
    get:
      tags:
        - Payment Requests
      summary: Consultar solicitud de cobro por token
      description: >
        Devuelve los detalles de una solicitud de cobro a partir de su token de
        pago. El usuario autenticado debe ser el pagador.
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: paymentToken
          required: true
          schema:
            type: string
            format: uuid
          description: Token de pago único de la solicitud
      responses:
        "200":
          description: Solicitud obtenida correctamente
          content:
            application/json:
              schema:
                type: object
                properties:
                  paymentRequest:
                    $ref: "#/components/schemas/PaymentRequest"
        "400":
          description: Token de pago inválido
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Token ausente, inválido o vencido
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: El usuario no es el pagador de la solicitud
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Solicitud de cobro no encontrada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Error interno del servidor
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /payment-requests/{paymentToken}/pay:
    post:
      tags:
        - Payment Requests
      summary: Pagar una solicitud de cobro
      description: >
        Realiza el pago de una solicitud de cobro pendiente. Se debita el saldo de
        la billetera del pagador y se acredita en la del creador.
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: paymentToken
          required: true
          schema:
            type: string
            format: uuid
          description: Token de pago único de la solicitud
        - in: header
          name: Idempotency-Key
          required: true
          schema:
            type: string
            maxLength: 100
          description: Clave de idempotencia para evitar duplicados.
      responses:
        "200":
          description: Solicitud pagada correctamente
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Solicitud de cobro pagada correctamente
                  paymentRequest:
                    $ref: "#/components/schemas/PaymentRequest"
        "400":
          description: Token de pago inválido o falta encabezado Idempotency-Key
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Token ausente, inválido o vencido
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: El usuario no es el pagador de la solicitud
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Solicitud no encontrada o billetera/saldo inexistente
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: La solicitud ya no está pendiente o conflicto en la transacción
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Saldo insuficiente en la billetera del pagador
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Error interno del servidor
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /payment-requests/{id}/cancel:
    patch:
      tags:
        - Payment Requests
      summary: Cancelar una solicitud de cobro
      description: >
        Cancela una solicitud de cobro pendiente de la cual el usuario es el creador.
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
          description: Identificador UUID de la solicitud de cobro
      responses:
        "200":
          description: Solicitud cancelada correctamente
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Solicitud de cobro cancelada correctamente
                  paymentRequest:
                    $ref: "#/components/schemas/PaymentRequest"
        "400":
          description: Identificador de la solicitud inválido
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Token ausente, inválido o vencido
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: El usuario no es el creador de la solicitud
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Solicitud de cobro no encontrada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: La solicitud ya no está pendiente
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Error interno del servidor
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /emails/deliveries/{deliveryId}/retry:
    post:
      tags:
        - Emails
      summary: Reintentar el envío de un correo fallido
      description: >
        Reintenta una notificación fallida. El usuario debe estar autenticado
        con Firebase y pertenecer a la transferencia o solicitud de cobro
        relacionada con el correo.
      security:
        - bearerAuth: []
      parameters:
        - name: deliveryId
          in: path
          required: true
          description: Identificador UUID del intento de correo fallido
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Reintento procesado correctamente
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Reintento de correo procesado correctamente
                  result:
                    type: object
                    properties:
                      status:
                        type: string
                        enum:
                          - sent
                          - failed
                          - skipped
                      deliveryId:
                        type: string
                        format: uuid
                        nullable: true
                      providerMessageId:
                        type: string
                        nullable: true
                      errorMessage:
                        type: string
                        nullable: true
        "400":
          description: Identificador de entrega inválido
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Token ausente, inválido o vencido
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: El usuario no pertenece a la operación
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: No se encontró el correo fallido o usuario/billetera no encontrados
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: El correo no tiene contenido o contexto disponible
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: El envío de correos está deshabilitado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Error interno del servidor
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /contacts:
    post:
      tags:
        - Contacts
      summary: Guardar un contacto frecuente
      description: >
        Guarda un contacto identificado por alias o número de cuenta de un
        usuario Globalance existente. El wallet destino se resuelve al guardar.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateContactInput"
      responses:
        "201":
          description: Contacto guardado
          content:
            application/json:
              schema:
                type: object
                properties:
                  contact:
                    $ref: "#/components/schemas/Contact"
        "400":
          description: Datos inválidos
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Token ausente, inválido o vencido
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Usuario inexistente o destinatario Globalance no encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: El contacto ya existe
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Error interno del servidor
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    get:
      tags:
        - Contacts
      summary: Listar contactos frecuentes
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Contactos del usuario
          content:
            application/json:
              schema:
                type: object
                properties:
                  contacts:
                    type: array
                    items:
                      $ref: "#/components/schemas/Contact"
        "401":
          description: Token ausente, inválido o vencido
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Error interno del servidor
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /contacts/{id}:
    delete:
      tags:
        - Contacts
      summary: Eliminar un contacto frecuente
      description: >
        Solo el dueño del contacto puede eliminarlo. Si el contacto no existe o
        pertenece a otro usuario, responde 404.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Identificador UUID del contacto
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Contacto eliminado
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        "400":
          description: Identificador inválido
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Token ausente, inválido o vencido
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Contacto no encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Error interno del servidor
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: Firebase ID Token
      description: Ingresar el token de Firebase sin escribir la palabra Bearer.

  schemas:
    Contact:
      type: object
      properties:
        id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        name:
          type: string
          example: Mamá
        contact_type:
          type: string
          enum:
            - alias
            - account_number
        contact_value:
          type: string
        contact_wallet_id:
          type: string
          format: uuid
        created_at:
          type: string
          format: date-time

    CreateContactInput:
      oneOf:
        - type: object
          properties:
            name:
              type: string
              minLength: 1
              maxLength: 50
            type:
              type: string
              enum:
                - alias
            value:
              type: string
              example: glb.mama
          required:
            - name
            - type
            - value
          additionalProperties: false
        - type: object
          properties:
            name:
              type: string
              minLength: 1
              maxLength: 50
            type:
              type: string
              enum:
                - account_number
            value:
              type: string
              example: GLB-1A2B3C4D
          required:
            - name
            - type
            - value
          additionalProperties: false

    AiAssistantInput:
      type: object
      properties:
        message:
          type: string
          minLength: 1
          maxLength: 1000
          example: ¿Cuánto tengo en dólares?
      required:
        - message
      additionalProperties: false

    ErrorResponse:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
              example: UNAUTHORIZED
            message:
              type: string
              example: Usuario no autenticado

    FirebaseUser:
      type: object
      required:
        - uid
      properties:
        uid:
          type: string
          description: Identificador único generado por Firebase
          example: firebase-user-123
        email:
          type: string
          format: email
          nullable: true
          example: usuario@correo.com
        name:
          type: string
          nullable: true
          example: Jazmín Morínigo
        picture:
          type: string
          format: uri
          nullable: true

    User:
      type: object
      properties:
        id:
          type: string
          format: uuid
        firebase_uid:
          type: string
        email:
          type: string
          format: email
        user_type:
          type: string
          enum:
            - person
            - company
          nullable: true
        display_currency:
          type: string
          example: ARS
        status:
          type: string
          enum:
            - active
            - inactive
            - blocked
        created_at:
          type: string
          format: date-time
        last_access_at:
          type: string
          format: date-time
          nullable: true

    Wallet:
      type: object
      properties:
        id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        alias:
          type: string
          example: jazmin.globalance
        account_number:
          type: string
          example: "0000000000000000000001"
        status:
          type: string
          enum:
            - active
            - inactive
            - blocked
        created_at:
          type: string
          format: date-time

    UserProfile:
      type: object
      properties:
        id:
          type: string
          format: uuid
        firebase_uid:
          type: string
        email:
          type: string
          format: email
        user_type:
          type: string
          enum:
            - person
            - company
          nullable: true
        display_currency:
          type: string
          example: ARS
        timezone:
          type: string
          example: America/Argentina/Buenos_Aires
        status:
          type: string
          enum:
            - active
            - inactive
            - blocked
        first_name:
          type: string
          nullable: true
        last_name:
          type: string
          nullable: true
        legal_name:
          type: string
          nullable: true

    PersonProfileInput:
      type: object
      required:
        - userType
        - firstName
        - lastName
        - document
        - phone
        - alias
        - displayCurrency
      properties:
        userType:
          type: string
          enum:
            - person
        firstName:
          type: string
          minLength: 2
          maxLength: 100
          example: Jazmín
        lastName:
          type: string
          minLength: 2
          maxLength: 100
          example: Morínigo
        document:
          type: string
          minLength: 5
          maxLength: 30
          example: "12345678"
        phone:
          type: string
          minLength: 7
          maxLength: 30
          example: "+5491123456789"
        alias:
          type: string
          minLength: 6
          maxLength: 30
          pattern: "^[a-z0-9.-]+$"
          example: jazmin.globalance
        displayCurrency:
          type: string
          enum:
            - ARS
            - USD
            - EUR
          example: ARS
          description: Moneda principal de la wallet. Determina cómo se clasifican las operaciones de compra y venta.
        timezone:
          type: string
          example: America/Argentina/Buenos_Aires
          description: Zona horaria del usuario (IANA). Determina los límites diarios y el historial. Si no se envía, se conserva el valor actual.
      additionalProperties: false

    CompanyProfileInput:
      type: object
      required:
        - userType
        - legalName
        - document
        - phone
        - alias
        - displayCurrency
      properties:
        userType:
          type: string
          enum:
            - company
        legalName:
          type: string
          minLength: 2
          maxLength: 150
          example: Globalance S.A.
        document:
          type: string
          minLength: 5
          maxLength: 30
          example: "30123456789"
        phone:
          type: string
          minLength: 7
          maxLength: 30
          example: "+5491123456789"
        alias:
          type: string
          minLength: 6
          maxLength: 30
          pattern: "^[a-z0-9.-]+$"
          example: globalance.empresa
        displayCurrency:
          type: string
          enum:
            - ARS
            - USD
            - EUR
          example: ARS
          description: Moneda principal de la wallet. Determina cómo se clasifican las operaciones de compra y venta.
        timezone:
          type: string
          example: America/Argentina/Buenos_Aires
          description: Zona horaria del usuario (IANA). Determina los límites diarios y el historial. Si no se envía, se conserva el valor actual.
      additionalProperties: false

    Balance:
      type: object
      properties:
        id:
          type: string
          format: uuid
        wallet_id:
          type: string
          format: uuid
        currency_code:
          type: string
          enum:
            - ARS
            - USD
            - EUR
        amount:
          type: string
          example: "1500.00"
          description: El monto se devuelve como texto para conservar la precisión decimal.
        updated_at:
          type: string
          format: date-time

    ExchangeInput:
      type: object
      required:
        - sourceCurrency
        - targetCurrency
        - sourceAmount
      properties:
        sourceCurrency:
          type: string
          enum:
            - ARS
            - USD
            - EUR
          example: ARS
        targetCurrency:
          type: string
          enum:
            - ARS
            - USD
            - EUR
          example: USD
        sourceAmount:
          type: string
          example: "100000"
          description: Monto a convertir en la moneda de origen (hasta 8 decimales).
      additionalProperties: false

    ExchangeTransaction:
      type: object
      properties:
        transaction_id:
          type: string
          format: uuid
        type:
          type: string
          enum:
            - purchase
            - sale
            - conversion
        status:
          type: string
          enum:
            - completed
        description:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
        completed_at:
          type: string
          format: date-time
          nullable: true
        source_currency:
          type: string
          example: ARS
        target_currency:
          type: string
          example: USD
        source_amount:
          type: string
        target_amount:
          type: string
        applied_rate:
          type: string
        rate_provider:
          type: string
          enum:
            - frankfurter
            - exchange_rate_api
        rate_fetched_at:
          type: string
          format: date-time
        source_balance_after:
          type: string
        target_balance_after:
          type: string

    Transaction:
      type: object
      properties:
        id:
          type: string
          format: uuid
        type:
          type: string
          enum:
            - income
            - purchase
            - sale
            - conversion
            - transfer
        status:
          type: string
        description:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
        completed_at:
          type: string
          format: date-time
          nullable: true
        source_currency:
          type: string
          nullable: true
        target_currency:
          type: string
          nullable: true
        applied_rate:
          type: string
          nullable: true
        rate_provider:
          type: string
          nullable: true
          enum:
            - frankfurter
            - exchange_rate_api
        rate_fetched_at:
          type: string
          format: date-time
          nullable: true
        destination_wallet_id:
          type: string
          format: uuid
          nullable: true
        recipient_name:
          type: string
          nullable: true
        funding_method:
          type: string
          nullable: true
        movements:
          type: array
          items:
            type: object
            properties:
              direction:
                type: string
                enum:
                  - debit
                  - credit
              concept:
                type: string
                enum:
                  - principal
                  - fee
              currency:
                type: string
              amount:
                type: string
              balance_before:
                type: string
              balance_after:
                type: string
              created_at:
                type: string
                format: date-time

    Quote:
      type: object
      properties:
        sourceCurrency:
          type: string
          example: ARS
        targetCurrency:
          type: string
          example: USD
        sourceAmount:
          type: string
        targetAmount:
          type: string
        rate:
          type: string
        provider:
          type: string
          enum:
            - frankfurter
            - exchange_rate_api
        fetchedAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time

    Rates:
      type: object
      properties:
        base:
          type: string
          example: USD
        rates:
          type: object
          additionalProperties:
            type: string
          example:
            ARS: "1498.1200000000"
            EUR: "0.8661200000"
        provider:
          type: string
          enum:
            - frankfurter
            - exchange_rate_api
        fetchedAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time

    WalletSummary:
      type: object
      properties:
        user:
          type: object
          properties:
            id:
              type: string
              format: uuid
            email:
              type: string
              format: email
            user_type:
              type: string
              enum:
                - person
                - company
              nullable: true
            first_name:
              type: string
              nullable: true
            last_name:
              type: string
              nullable: true
            legal_name:
              type: string
              nullable: true
        wallet:
          $ref: "#/components/schemas/Wallet"
        balances:
          type: array
          items:
            $ref: "#/components/schemas/Balance"

    DemoFundingInput:
      type: object
      required:
        - currency
        - amount
      properties:
        currency:
          type: string
          enum:
            - ARS
            - USD
            - EUR
          example: USD
        amount:
          type: string
          example: "5000"
          description: Monto a cargar (hasta 8 decimales).
      additionalProperties: false

    DemoFundingTransaction:
      type: object
      properties:
        transaction_id:
          type: string
          format: uuid
        status:
          type: string
          example: completed
        currency:
          type: string
          enum:
            - ARS
            - USD
            - EUR
          example: USD
        amount:
          type: string
          example: "5000.00"
        balance_before:
          type: string
          example: "1500.00"
        balance_after:
          type: string
          example: "6500.00"
        created_at:
          type: string
          format: date-time

    InternalTransferInput:
      type: object
      required:
        - currency
        - amount
        - destinationType
        - destinationValue
      properties:
        currency:
          type: string
          enum:
            - ARS
            - USD
            - EUR
          example: USD
        amount:
          type: string
          example: "100"
        destinationType:
          type: string
          enum:
            - alias
            - accountNumber
          example: alias
        destinationValue:
          type: string
          example: jazmin.globalance
          description: Alias del destinatario o número de cuenta GLB-XXXXXXXX.
      additionalProperties: false

    InternalTransferTransaction:
      type: object
      properties:
        transaction_id:
          type: string
          format: uuid
        status:
          type: string
          example: completed
        destination_wallet_id:
          type: string
          format: uuid
        destination_alias:
          type: string
          example: jazmin.globalance
        currency:
          type: string
          enum:
            - ARS
            - USD
            - EUR
          example: USD
        amount:
          type: string
          example: "100.00"
        source_balance_after:
          type: string
          example: "1400.00"
        destination_balance_after:
          type: string
          example: "100.00"
        created_at:
          type: string
          format: date-time

    CreatePaymentRequestInput:
      type: object
      required:
        - payerEmail
        - currency
        - amount
      properties:
        payerEmail:
          type: string
          format: email
          example: pagador@correo.com
          description: Correo electrónico del usuario pagador.
        currency:
          type: string
          enum:
            - ARS
            - USD
            - EUR
          example: USD
        amount:
          type: string
          example: "150.00"
          description: Monto de la solicitud (hasta 8 decimales).
      additionalProperties: false

    PaymentRequest:
      type: object
      properties:
        id:
          type: string
          format: uuid
        payment_token:
          type: string
          format: uuid
        requester_user_id:
          type: string
          format: uuid
        payer_user_id:
          type: string
          format: uuid
        payer_email:
          type: string
          format: email
